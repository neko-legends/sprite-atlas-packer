[package]
name = "sprite-atlas-packer"
version = "0.1.0"
description = "Local deterministic sprite atlas packer"
authors = ["Neko Legends"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sprite_atlas_packer"
crate-type = ["rlib"]

[[bin]]
name = "sprite-atlas-packer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[features]
default = []
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-single-instance",
]

[dependencies]
base64 = "0.22"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
notify = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tauri = { version = "2.11.0", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.0", optional = true }
tauri-plugin-opener = { version = "2.5.0", optional = true }
tauri-plugin-single-instance = { version = "2.4.2", optional = true }
thiserror = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
